name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # prisma generate は DATABASE_URL 不要。next build は接続しないためダミーで通る
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
